<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS 선택자 연습</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 아래 요소들 하나하나에 style.css에서 다른 방식으로 색을 입혀볼 거예요 -->

  <h1>제목입니다 (태그 선택자로 색칠됨)</h1>

  <p>이건 그냥 평범한 문단.</p>

  <p class="highlight">이건 class="highlight"가 붙은 문단.</p>

  <p id="special">이건 id="special"이 붙은 문단.</p>

  <div class="box">
    <p>이건 .box 안에 있는 문단 (하위 선택자로 색칠됨)</p>
  </div>

  <p class="highlight bold">이건 class 2개(highlight, bold)를 같이 가진 문단.</p>

</body>
</html>
